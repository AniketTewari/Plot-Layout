<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <title>Interactive Society Layout</title>

    <style>
        .db-loader {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            font-size: 14px;
            font-weight: 600;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #ddd;
            border-top: 4px solid #198754;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        :root {
            --ink: #2b2420;
            --paper: #eef1df;
            --green-bg: #b9c65a;
            --green-bg-dark: #a7b64a;
            --road: #4a433f;
            --road-dark: #3a342f;
            --plot-res: #d9b48f;
            --plot-res-line: #f4e9db;
            --plot-shop: #b56a3c;
            --plot-shop-line: #f4e9db;
            --plot-c: #d9b48f;
            --garden: #7fae4a;
            --garden-dark: #5f8f34;
            --accent: #8a3b22;
            --sold: #8a2f2f;
            --reserved: #9a7a1f;
            --available: #2f7a3f;
            --panel-bg: #fffaf2;
            --panel-border: #c9b79a;

            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #1c1f14;
            color: var(--ink);
        }

        body {
            overflow: auto;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header.topbar {
            background: linear-gradient(180deg, #2c2620, #211c17);
            color: #f3ead9;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            border-bottom: 3px solid var(--accent);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: #f3ead9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #211c17;
            font-size: 18px;
            letter-spacing: -1px;
            flex-shrink: 0;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: .4px;
            font-weight: 700;
        }

        .brand-text p {
            margin: 2px 0 0;
            font-size: 11.5px;
            color: #c9bda3;
        }

        .hint {
            font-size: 12.5px;
            color: #d9cdb2;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .14);
            padding: 7px 12px;
            border-radius: 20px;
        }

        /* =====================================================
           STAGE
        ====================================================== */

        .stage {
            position: relative;
            flex: 1;

            display: block;
            /* was: display: flex; justify-content: ...; align-items: ...; */

            padding: 18px;

            background:
                radial-gradient(circle at 30% 10%,
                    #2a2e1c 0%,
                    #1c1f14 60%);

            perspective: 1400px;
            perspective-origin: 50% 45%;

            overflow: auto;
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;

            min-height: 0;
        }

        /* =====================================================
           3D WRAPPER
        ====================================================== */

        .map-3d {
            position: relative;

            width: 100%;
            max-width: 1180px;
            min-width: 320px;

            margin: 0 auto;
            /* ← new: centers it, and scroll overflow becomes symmetric */

            transform-style: preserve-3d;
            transform: perspective(1400px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
            transform-origin: center top;
            will-change: transform;

            touch-action: pan-x pan-y;
            flex-shrink: 0;
            /* harmless leftover, can stay or be removed */
        }

        /* =====================================================
           MAP
        ====================================================== */

        .map-wrap {
            position: relative;

            width: 100%;
            max-width: 1180px;

            background: var(--green-bg);

            border-radius: 10px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .45);

            border: 1px solid #6f7a2e;

            transform-style: preserve-3d;

            /*
             * Do not clip transformed popup/map content.
             */
            overflow: visible;

            touch-action: pan-x pan-y;
        }

        svg#siteMap {
            display: block;
            width: 100%;
            height: auto;

            transform-style: preserve-3d;

            /*
             * Prevent SVG's own gesture handling from
             * conflicting with our pointer system.
             */
            touch-action: pan-x pan-y;
        }

        /* =====================================================
           PLOTS
        ====================================================== */

        .plot {
            cursor: pointer;
            pointer-events: all;
            stroke: var(--plot-res-line);
            stroke-width: 2;
            transition: filter .15s ease, transform .15s ease;
        }

        .plot:hover {
            filter: brightness(1.12);
        }

        .plot.selected {
            stroke: #1c1f14;
            stroke-width: 3.5;
            filter: brightness(1.18);
        }

        .plot.status-sold {
            fill-opacity: .85;
        }

        .plot-label {
            font-size: 9.5px;
            font-weight: 700;
            fill: #3a2c1e;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .plot-label.shop {
            fill: #fbe9dc;
        }

        .plot-label.cblock {
            font-size: 9px;
        }

        .status-dot {
            pointer-events: none;
        }

        .garden-zone {
            cursor: pointer;
        }

        .garden-zone:hover .garden-fill {
            filter: brightness(1.08);
        }

        /* =====================================================
   POPUP
====================================================== */

        .popup {
            position: absolute;
            z-index: 50;

            width: 160px;
            /* was 245px */
            max-width: calc(100vw - 30px);

            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .98),
                    rgba(250, 244, 232, .98));

            border: 1px solid rgba(201, 183, 154, .9);
            border-radius: 10px;
            /* was 16px */

            box-shadow:
                0 14px 32px rgba(0, 0, 0, .32),
                0 3px 10px rgba(0, 0, 0, .10);

            overflow: visible;
            padding: 0;
            opacity: 0;

            transform: translateY(8px) scale(.94);
            transform-origin: center bottom;
            pointer-events: none;

            transition:
                opacity .18s ease,
                transform .18s cubic-bezier(.2, .8, .2, 1);
        }

        .popup.visible {
            opacity: 1;

            transform:
                translateY(0) scale(1);

            pointer-events: auto;
        }


        /* =====================================================
   POPUP HEADER
   Triangle / arrow removed
====================================================== */

        .popup-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 7px 8px;
            /* was 13px 14px */

            background:
                linear-gradient(135deg, #3b342c, #211c17);

            color: #fff;
            border-radius: 12px 12px 0 0;
            /* match new radius */
            border-bottom: 2px solid var(--accent);
        }

        .popup-head strong {
            font-size: 11.5px;
            /* was default/larger */
        }


        /* Small decorative line */

        .popup-head::before {
            content: "";

            position: absolute;

            left: 14px;
            bottom: -3px;

            width: 42px;
            height: 3px;

            background: #d9b48f;

            border-radius: 5px;
        }


        /* =====================================================
           CLOSE BUTTON
        ====================================================== */

        .popup-close {
            width: 18px;
            /* was 28px */
            height: 22px;

            border-radius: 50%;
            background: rgba(255, 255, 255, .10);
            color: #e9dcc8;

            font-size: 9px;
            /* was 14px */
            line-height: 22px;

            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background .15s ease,
                color .15s ease,
                transform .15s ease;
        }


        .popup-close:hover {
            background: rgba(255, 255, 255, .20);

            color: #fff;

            transform: rotate(90deg);
        }

        /* =====================================================
           POPUP BODY
        ====================================================== */

        .popup-body {
            padding: 7px 8px 8px;
            /* was 12px 13px 13px */
            background: #fffaf2;
            border-radius: 0 0 12px 12px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            min-height: 21px;
            /* was 32px */
            padding: 3px 4px;
            /* was 6px 7px */

            border-bottom: 1px solid #eee3d1;
            font-size: 9px;
            /* was 12px */
        }

        .detail-row span {
            font-size: 8px;
            /* was 11px */
            font-weight: 600;
        }

        .detail-row strong {
            font-size: 9px;
            /* was 12px */
            font-weight: 700;
        }

        .detail-row .status-pill {
            min-width: 48px;
            /* was 60px */
            padding: 2px 5px;
            /* was 3px 7px */
            font-size: 7.5px;
            /* was 9px */
        }

        .status-pill.available {
            background: #2f7a3f;
        }

        .status-pill.reserved {
            background: #9a7a1f;
        }

        .status-pill.sold {
            background: #8a2f2f;
        }

        /* =====================================================
           ENQUIRE
        ====================================================== */

        .enquire-btn {
            width: 100%;
            margin-top: 7px;
            /* was 9px */
            padding: 6px 8px;
            /* was 8px 10px */

            border-radius: 6px;
            /* was 7px */
            font-size: 9.5px;
            /* was 11px */
            font-weight: 700;
        }

        .enquire-btn:hover {
            filter: brightness(1.08);

            box-shadow:
                0 7px 15px rgba(113, 45, 27, .32);
        }

        .enquire-btn:active {
            transform: scale(.97);
        }

        /* =====================================================
           ROTATION CONTROLS
        ====================================================== */

        .rotation-controls {
            position: fixed;

            z-index: 100;

            bottom: 15px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 6px;

            padding: 6px;

            background: rgba(33, 28, 23, .88);

            border:
                1px solid rgba(255, 255, 255, .18);

            border-radius: 12px;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, .4);

            backdrop-filter: blur(8px);

            user-select: none;

            touch-action: manipulation;
        }

        .rotation-controls button {
            width: 34px;
            height: 32px;

            border: none;
            border-radius: 7px;

            background: #4a433f;
            color: #f3ead9;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .rotation-controls button:hover {
            background: #8a3b22;
        }

        .rotation-controls button:active {
            transform: scale(.9);
        }

        .rotation-text {
            color: #d9cdb2;
            font-size: 10px;
            padding: 0 5px;
            white-space: nowrap;
        }

        /* =====================================================
           FOOTER
        ====================================================== */

        .foot {
            background: #211c17;
            color: #c9bda3;
            padding: 8px 15px;
            text-align: center;
            font-size: 10px;
            flex-shrink: 0;
        }

        /* =====================================================
           MOBILE
        ====================================================== */

        @media(max-width:640px) {

            html,
            body {
                width: 100%;
                min-height: 100%;
                overflow: auto;
            }

            .app {
                min-height: 100dvh;
            }

            header.topbar {
                padding: 10px 12px;
            }

            .stage {
                min-height: calc(100dvh - 80px);

                padding: 10px;

                perspective: 1100px;

                overflow: auto;

                touch-action: pan-x pan-y;

                /*
                 * Gives the browser enough room to scroll
                 * around a transformed layout.
                 */
                align-items: flex-start;
            }

            .map-3d {
                width: 100%;
                min-width: 320px;

                transform-origin: center top;
            }

            .map-wrap {
                overflow: visible;
            }

            .popup {
                width: 190px;
            }

            .brand-text h1 {
                font-size: 13.5px;
            }

            .brand-text p {
                font-size: 10px;
            }

            .hint {
                display: none;
            }

            .rotation-controls {
                bottom: 8px;
            }

            .rotation-text {
                display: none;
            }
        }

        @media (max-width: 640px) {

            .stage {
                padding: 8px;
                padding-top: 12px;

                /*
     * Keep the map below the header.
     */
                overflow: auto;

                align-items: flex-start;
            }

            .map-3d {
                margin-top: 8px;
                transform-origin: center top;
            }

            .popup {
                width: min(145px, calc(100vw - 16px));
                /* was 170px */
            }

            .popup-head {
                padding: 6px 7px;
            }

            .popup-head strong {
                font-size: 10.5px;
            }

            .popup-body {
                padding: 6px 7px;
            }

            .detail-row {
                min-height: 19px;
                padding: 2px 4px;
                font-size: 8.5px;
            }

            .detail-row span {
                font-size: 7.5px;
            }

            .detail-row strong {
                font-size: 8.5px;
            }

            .enquire-btn {
                padding: 5px 7px;
                font-size: 8.5px;
            }
        }
    </style>
</head>

    <script type="module">

        /* =========================================================

        }

        }

        /* =========================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAOL9EvRIkZ_puzbGTdlIREeJYImI1HZeI",
            authDomain: "plot-layout.firebaseapp.com",

            messagingSenderId: "465165602589",
            appId: "1:465165602589:web:10d055d54e669222fe1bf4",
            measurementId: "G-QTQJSX23EP"
        };

        /* =========================================================
           INITIALIZE FIREBASE
           ========================================================= */

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const database =
            getDatabase(app);


        // console.log(
        //     "Firebase initialized"
        // );

        // console.log(
        //     "Realtime Database:",
        //     firebaseConfig.databaseURL
        // );




        (function () {

            const svgNS =
                "http://www.w3.org/2000/svg";


            const plotsLayer =
                document.getElementById("plotsLayer");

            const roadNetwork =
                document.getElementById("roadNetwork");

            const highway =
                document.getElementById("highway");

            const perimeterTrees =
                document.getElementById("perimeterTrees");


            /* =====================================================
               GEOMETRY
            ====================================================== */

            function bilerp(TL, TR, BL, BR, u, v) {

                const x =
                    TL.x * (1 - u) * (1 - v) +
                    TR.x * u * (1 - v) +
                    BL.x * (1 - u) * v +
                    BR.x * u * v;

                const y =
                    TL.y * (1 - u) * (1 - v) +
                    TR.y * u * (1 - v) +
                    BL.y * (1 - u) * v +
                    BR.y * u * v;

                return { x, y };

            }


            function pointsAttr(pts) {

                return pts
                    .map(p =>
                        p.x.toFixed(1) +
                        "," +
                        p.y.toFixed(1)
                    )
                    .join(" ");

            }


            function centroid(pts) {

                let x = 0;
                let y = 0;

                pts.forEach(p => {

                    x += p.x;
                    y += p.y;

                });

                return {

                    x: x / pts.length,
                    y: y / pts.length

                };

            }


            function edgeAngle(p1, p2) {

                return Math.atan2(
                    p2.y - p1.y,
                    p2.x - p1.x
                ) * 180 / Math.PI;

            }


            const allPlots = [];


            /* =====================================================
               BUILD GRID
            ====================================================== */

            function buildGrid(
                TL,
                TR,
                BL,
                BR,
                cols,
                rows,
                labels2D,
                category,
                opts
            ) {

                opts = opts || {};

                for (let r = 0; r < rows; r++) {

                    for (let c = 0; c < cols; c++) {

                        const u0 = c / cols;
                        const u1 = (c + 1) / cols;

                        const v0 = r / rows;
                        const v1 = (r + 1) / rows;


                        const p1 =
                            bilerp(
                                TL,
                                TR,
                                BL,
                                BR,
                                u0,
                                v0
                            );

                        const p2 =
                            bilerp(
                                TL,
                                TR,
                                BL,
                                BR,
                                u1,
                                v0
                            );

                        const p3 =
                            bilerp(
                                TL,
                                TR,
                                BL,
                                BR,
                                u1,
                                v1
                            );

                        const p4 =
                            bilerp(
                                TL,
                                TR,
                                BL,
                                BR,
                                u0,
                                v1
                            );


                        const label =
                            labels2D[r][c];


                        if (!label) {
                            continue;
                        }


                        addPlot(
                            label,
                            category,

            /* =====================================================
               ADD PLOT
            ====================================================== */

            function addPlot(
                label,
                category,
                pts,
                opts
            ) {

                opts = opts || {};


                const g =
                    document.createElementNS(
                        svgNS,
                        "g"
                    );


                const poly =
                    document.createElementNS(
                        svgNS,
                        "polygon"
                    );


                poly.setAttribute(
                    "points",
                    pointsAttr(pts)
                );


                poly.setAttribute(
                    "class",
                    "plot cat-" + category
                );


                poly.dataset.label =
                    label;

                poly.dataset.category =
                    category;


                let fill =
                    "#d9b48f";


                if (category === "shop") {

                    fill =
                        "url(#shopHatch)";

                }


                if (category === "community") {

                    fill =
                        "#e3c6a2";

                }


                poly.setAttribute(
                    "fill",
                    fill
                );


                g.appendChild(poly);


                const c =
                    centroid(pts);


                const txt =
                    document.createElementNS(
                        svgNS,
                        "text"
                    );


                txt.setAttribute(
                    "x",
                    c.x
                );

                txt.setAttribute(
                    "y",
                    c.y
                );


                let rot =
                    opts.rotate;


                if (rot === undefined) {

                    rot =
                        edgeAngle(
                            pts[0],
                            pts[1]
                        );


                    if (rot > 90)
                        rot -= 180;


                    if (rot < -90)
                        rot += 180;


                    rot =
                        rot * 0.35;

                }


                txt.setAttribute(
                    "transform",
                    `rotate(
                ${rot.toFixed(1)}
                ${c.x.toFixed(1)}
                ${c.y.toFixed(1)}
            )`
                );


                txt.setAttribute(
                    "class",
                    "plot-label" +
                    (category === "shop"
                        ? " shop"
                        : "") +
                    (category === "community"
                        ? " cblock"
                        : "")
                );


                txt.textContent =
                    label;


                g.appendChild(txt);


                plotsLayer.appendChild(g);


                allPlots.push({

                    label,
                    category,
                    poly,
                    group: g,
                    center: c

                });

            }

            /* =====================================================
               SEQUENCE
            ====================================================== */

            function seq(prefix, from, to) {

                const out = [];


                if (from <= to) {

                    for (
                        let i = from;
                        i <= to;
                        i++
                    ) {

                        out.push(
                            prefix + i
                        );

                    }

                } else {

                    for (
                        let i = from;
                        i >= to;
                        i--
                    ) {

                        out.push(
                            prefix + i
                        );

                    }

                }


                return out;

            }

            async function detailsFor(plotNo) {
                const loader = document.getElementById("dbLoader");

                loader.style.display = "flex";
                try {
                    const snapshot = await get(
                        ref(database, `plots/${plotNo}`)
                    );

                    if (snapshot.exists()) {
                        return snapshot.val();
                    }

                    return null;

                } catch (error) {
                    console.error("Error fetching details:", error);
                    return null;
                }
                finally {

                    loader.style.display = "none";

                }
            }

            /* =====================================================
               POPUP
            ====================================================== */

            const popup =
                document.getElementById(
                    "popup"
                );


            const popupTitle =
                document.getElementById(
                    "popupTitle"
                );


            const popupBody =
                document.getElementById(
                    "popupBody"
                );


            const popupClose =
                document.getElementById(
                    "popupClose"
                );


            const mapWrap =
                document.getElementById(
                    "mapWrap"
                );


            const svgEl =
                document.getElementById(
                    "siteMap"
                );


            let selectedEl = null;


            function clearSelection() {

                if (selectedEl) {

                    selectedEl.classList.remove(
                        "selected"
                    );

                    selectedEl = null;

                }

            }


            /* =====================================================
   CLOSE POPUP
===================================================== */

            function closePopup() {

                popup.classList.remove("visible");

                popup.setAttribute(
                    "aria-hidden",
                    "true"
                );

                clearSelection();

            }


            /* Close button */
            popupClose.addEventListener(
                "click",
                closePopup
            );


            /* =====================================================
            OUTSIDE CLICK / TOUCH
            ===================================================== */

            // document.addEventListener(
            //     "pointerdown",
            //     function (e) {

            //         if (
            //             !popup.classList.contains("visible")

            //             return;

            //         /* Inside popup */

            /* =====================================================
               SVG → SCREEN
            ====================================================== */

            function svgPointToScreen(pt) {

                const viewBox =
                    svgEl.viewBox.baseVal;


                return {

                    x:
                        (pt.x - viewBox.x) *
                        (
                            svgEl.clientWidth /
                            viewBox.width
                        ),

                    y:
                        (pt.y - viewBox.y) *
                        (
                            svgEl.clientHeight /
                            viewBox.height
                        )

                };

            }


            /* =====================================================
               SHOW PLOT POPUP
            ====================================================== */

            async function showPopupFor(plotObj, clickEvt) {

                // Remove previous selection
                allPlots.forEach(p =>
                    p.poly.classList.remove("selected")
                );

                plotObj.poly.classList.add("selected");
                selectedEl = plotObj.poly;

                const d = await detailsFor(
                    plotObj.label
                    // plotObj.category
                );

                // console.log("Plot Details fetched from Database= ", (d));


                popupTitle.textContent = plotObj?.label;
                // popupTitle.textContent = d?.plotId;

                popupBody.innerHTML = `
    <div class="detail-row">
        <span>Type</span>
        <strong>${d?.type}</strong>
    </div>

    <div class="detail-row">
        <span>Dimensions</span>
        <strong>${d?.dimensions}</strong>
    </div>

    <div class="detail-row">
        <span>Area</span>
        <strong>${d?.area}</strong>
    </div>

    <div class="detail-row">
        <span>Facing</span>
        <strong>${d?.facing}</strong>
    </div>

    <div class="detail-row">
        <span>Est. Price</span>
        <strong>${d?.estPrice}</strong>
    </div>

    <div class="detail-row">
        <span>Status</span>
        <strong class="status-pill ${d?.status?.toLowerCase()}">
            ${d?.status}
        </strong>
    </div>

    <button
        class="enquire-btn"
        // onclick="window.enquirePlot('${d?.plotId}')">
        Enquire About This Plot
    </button>
`;

                window.enquirePlot = function (plotNo) {

                    const phoneNumber = "919876543210";

                    const message =
                        `Hi, I am interested in Plot ${plotNo}.`;

                    const whatsappUrl =
                        "https://wa.me/" +
                        phoneNumber +
                        "?text=" +
                        encodeURIComponent(message);

                    window.open(whatsappUrl, "_blank");
                };

                // Show popup first so dimensions are available
                popup.classList.add("visible");

                popup.setAttribute(
                    "aria-hidden",
                    "false"
                );

                requestAnimationFrame(() => {

                    const p =
                        svgPointToScreen(plotObj.center);

                    const popupWidth =
                        popup.offsetWidth;

                    const popupHeight =
                        popup.offsetHeight;

                    const mapWidth =
                        svgEl.clientWidth;

                    const mapHeight =
                        svgEl.clientHeight;

                    const gap = 12;

                    /*
                     * Get actual screen positions.
                     * This is important on mobile because the
                     * header may overlap the map.
                     */
                    const mapRect =
                        mapWrap.getBoundingClientRect();

                    /*
                     * Plot position relative to the viewport
                     */
                    const plotScreenX =
                        mapRect.left + p.x;

                    const plotScreenY =
                        mapRect.top + p.y;

                    /*
                     * Header height
                     */
                    const header =
                        document.querySelector(".topbar");

                    const headerRect =
                        header
                            ? header.getBoundingClientRect()
                            : { bottom: 0 };

                    const headerBottom =
                        headerRect.bottom;

                    /*
                     * Available viewport
                     */
                    const viewportWidth =
                        window.innerWidth;

                    const viewportHeight =
                        window.innerHeight;

                    /*
                     * Calculate popup position
                     * relative to mapWrap.
                     */
                    let left =
                        p.x + gap;

                    let top =
                        p.y - popupHeight / 2;


                    /*
                     * If popup goes beyond right side,
                     * move it to the left of the plot.
                     */
                    if (
                        plotScreenX +
                        gap +
                        popupWidth >
                        viewportWidth - 8
                    ) {

                        left =
                            p.x -
                            popupWidth -
                            gap;

                    }


                    /*
                     * Calculate popup's actual viewport Y
                     */
                    let popupScreenY =
                        mapRect.top + top;


                    /*
                     * Prevent popup from going behind header.
                     *
                     * Extra 8px gives some breathing room.
                     */
                    const minimumScreenY =
                        headerBottom + 8;


                    if (
                        popupScreenY <
                        minimumScreenY
                    ) {

                        top =
                            minimumScreenY -
                            mapRect.top;

                    }


                    /*
                     * Recalculate after moving down.
                     */
                    popupScreenY =
                        mapRect.top + top;


                    /*
                     * Prevent popup from going below screen.
                     */
                    const maximumScreenY =
                        viewportHeight -
                        popupHeight -
                        8;


                    if (
                        popupScreenY >
                        maximumScreenY
                    ) {

                        top =
                            maximumScreenY -
                            mapRect.top;

                    }


                    /*
                     * Horizontal safety
                     */
                    if (left < 8) {
                        left = 8;
                    }

                    if (
                        left + popupWidth >
                        mapWidth - 8
                    ) {

                        left =
                            mapWidth -
                            popupWidth -
                            8;

                    }


                    /*
                     * Make sure popup is never above
                     * the mobile header.
                     */
                    if (
                        mapRect.top + top <
                        minimumScreenY
                    ) {

                        top =
                            minimumScreenY -
                            mapRect.top;

                    }


                    popup.style.left =
                        `${left}px`;

                    popup.style.top =
                        `${top}px`;

                });
            }


            /* =====================================================
               PLOT CLICK
            ====================================================== */

            plotsLayer.addEventListener(
                "click",
                function (e) {

                    const plot =
                        e.target.closest(
                            ".plot"
                        );


                    if (!plot) {
                        return;
                    }


                    e.stopPropagation();


                    const plotObj =
                        allPlots.find(
                            p =>
                                p.poly === plot
                        );


                    if (!plotObj) {

                    }


                    showPopupFor(

            /* =====================================================
               GARDEN POPUPS
            ====================================================== */

            function wireGarden(id) {

                const el =
                    document.getElementById(id);


                el.addEventListener(
                    "click",
                    e => {

                        e.stopPropagation();


                        clearSelection();


                        const box =
                            el.getBBox();


                        const center = {

                            x:
                                box.x +
                                box.width / 2,

                            y:
                                box.y +
                                box.height / 2

                        };


                        popupTitle.textContent =
                            el.dataset.name;


                        popupBody.innerHTML = `

                    <p style="
                        margin:0 0 10px;
                        font-size:12.5px;
                        color:#5b503d;
                    ">
                        ${el.dataset.desc}
                    </p>

                    <div class="detail-row">
                        <span>Type</span>
                        <strong>
                            Common Area
                        </strong>
                    </div>

                    <div class="detail-row">
                        <span>Access</span>
                        <strong>
                            All Residents
                        </strong>
                    </div>

                `;


                        popup.classList.add(
                            "visible"
                        );


                        popup.setAttribute(
                            "aria-hidden",
                            "false"
                        );


                        requestAnimationFrame(
                            function () {

                                const screenPt =
                                    svgPointToScreen(
                                        center
                                    );


                                const pw =
                                    popup.offsetWidth;

                                const ph =
                                    popup.offsetHeight;


                                const wrapRect =
                                    mapWrap.getBoundingClientRect();


                                let left =
                                    screenPt.x -
                                    pw / 2;


                                let top =
                                    screenPt.y -
                                    ph -
                                    18;


                                let arrowClass =
                                    "arrow-bottom";


                                if (top < 4) {

                                    top =
                                        screenPt.y +
                                        18;

                                    arrowClass =
                                        "arrow-top";

                                }


                                if (left < 4) {
                                    left = 4;
                                }


                                if (
                                    left + pw >
                                    wrapRect.width - 4
                                ) {

                                    left =
                                        wrapRect.width -
                                        pw -
                                        4;

                                }


                                popup.classList.remove(
                                    "arrow-top",
                                    "arrow-bottom"
                                );


                                popup.classList.add(
                                    arrowClass
                                );


                                popup.style.left =
                                    left + "px";


                                popup.style.top =
                                    top + "px";

                            }
                        );

                    }
                );

            }


            wireGarden(
                "gardenSmall"
            );

            wireGarden(
                "gardenBig"
            );


            /* =====================================================
               CLOSE ON RESIZE / SCROLL
            ====================================================== */

            // window.addEventListener(
            //     "resize",
            //     closePopup
            // );


            /*
             * Don't close popup on every stage scroll.
             * Only close when the page itself is scrolled.
             */
            // window.addEventListener(
            //     "scroll",
            //     closePopup,
            //     true
            // );


            /* =====================================================
               3D ROTATION + PINCH ZOOM
            ====================================================== */

            const stage =
                document.getElementById(
                    "stage"
                );


            const map3D =
                document.getElementById(
                    "map3D"
                );


            const rotateLeft =
                document.getElementById(
                    "rotateLeft"
                );


            const rotateRight =
                document.getElementById(
                    "rotateRight"
                );


            const rotateUp =
                document.getElementById(
                    "rotateUp"
                );


            const rotateDown =
                document.getElementById(
                    "rotateDown"
                );


            const resetRotation =
                document.getElementById(
                    "resetRotation"
                );


            /* =====================================================
               ROTATION
            ====================================================== */

            let rotationX = 0;
            let rotationY = 0;
            let rotationZ = 0;


            /* =====================================================
               ZOOM
            ====================================================== */

            let zoom = 1.8;


            const MIN_ZOOM = 0.65;
            const MAX_ZOOM = 2.5;

            const INITIAL_ZOOM = 1.8;


            const MAX_X = 58;
            const MAX_Y = 65;


            /* =====================================================
               POINTER TRACKING
            ====================================================== */

            const pointers =
                new Map();


            let oneFingerActive =
                false;


            let pinchActive =
                false;


            let moved =
                false;


            let startX = 0;
            let startY = 0;


            let startRotationX = 0;
            let startRotationY = 0;


            let pinchStartDistance = 0;
            let pinchStartZoom = 1;




            function reserveZoomSpace() {

                // Temporarily clear margins to measure the true natural width
                map3D.style.marginLeft = "";
                map3D.style.marginRight = "";

                const naturalWidth = map3D.offsetWidth;

                // Reserve enough space for the largest possible zoom (both directions)
                const maxExtra = naturalWidth * (MAX_ZOOM - 1);
                const half = maxExtra / 2;

                map3D.style.marginLeft = half + "px";
                map3D.style.marginRight = half + "px";

            }


            /* =====================================================
               CLAMP
            ====================================================== */

            function clamp(
                value,
                min,
                max
            ) {

                return Math.max(
                    min,
                    Math.min(
                        max,
                        value
                    )
                );

            }

            function centerStage() {

                const scrollableWidth =
                    stage.scrollWidth - stage.clientWidth;

                if (scrollableWidth > 0) {
                    stage.scrollLeft = scrollableWidth / 2;
                }

                const scrollableHeight =
                    stage.scrollHeight - stage.clientHeight;

                if (scrollableHeight > 0) {
                    stage.scrollTop = scrollableHeight / 2;
                }

            }


            /* =====================================================
               APPLY TRANSFORM
            ====================================================== */

            function applyTransform(
                smooth = false
            ) {

                if (smooth) {

                    map3D.style.transition =
                        "transform .28s cubic-bezier(.2,.8,.2,1)";

                }

                else {

                    map3D.style.transition =
                        "none";

                }


                map3D.style.transform = `

            perspective(1400px)

            rotateX(
                ${rotationX}deg
            )

            rotateY(
                ${rotationY}deg
            )

            rotateZ(
                ${rotationZ}deg
            )

            scale(
                ${zoom}
            )

        `;

            }


            /* =====================================================
               POINTER DISTANCE
            ====================================================== */

            function getPointerDistance() {

                if (
                    pointers.size < 2
                ) {

                    return 0;

                }


                const values =
                    Array.from(
                        pointers.values()
                    );


                const p1 =
                    values[0];

                const p2 =
                    values[1];


                const dx =
                    p2.x - p1.x;

                const dy =
                    p2.y - p1.y;


                return Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            }


            /* =====================================================
               POINTER DOWN
            ====================================================== */

            stage.addEventListener(
                "pointerdown",
                function (e) {

                    if (
                        e.target.closest(".popup") ||
                        e.target.closest(".rotation-controls")
                    ) {
                        return;
                    }

                    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    /* TWO FINGERS — pinch zoom (unchanged) */
                    if (pointers.size === 2) {

                        pinchActive = true;
                        oneFingerActive = false;
                        moved = true;

                        pinchStartDistance = getPointerDistance();
                        pinchStartZoom = zoom;

                        return;

                    }

                    /*
                     * ONE FINGER — rotation disabled.
                     * Just track the pointer for potential future pinch,
                     * but don't start rotation tracking.
                     */

                },
                { passive: true }
            );

            /* =====================================================
               POINTER MOVE
            ====================================================== */

            stage.addEventListener(
                "pointermove",
                function (e) {

                    if (!pointers.has(e.pointerId)) {
                        return;
                    }

                    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    /* PINCH ZOOM (unchanged) */
                    if (pointers.size >= 2 && pinchActive) {

                        const currentDistance = getPointerDistance();

                        if (pinchStartDistance > 0) {

                            const ratio = currentDistance / pinchStartDistance;

                            zoom = clamp(pinchStartZoom * ratio, MIN_ZOOM, MAX_ZOOM);

                            applyTransform(false);

                        }

                        return;

                    }

                    /*
                     * One-finger rotation removed —
                     * single-finger drag no longer rotates the map.
                     */

                },
                { passive: true }
            );

            /* =====================================================
               POINTER UP
            ====================================================== */

            stage.addEventListener(
                "pointerup",
                function (e) {

                    pointers.delete(
                        e.pointerId
                    );


                    /*
                     * If the pinch ends, do not immediately
                     * start a one-finger rotation.
                     */

                    if (
                        pointers.size < 2
                    ) {

                        pinchActive =
                            false;

                    }


                    if (
                        pointers.size === 0
                    ) {

                        oneFingerActive =
                            false;


                        applyTransform(
                            true
                        );

                    }

                }
            );


            /* =====================================================
               POINTER CANCEL
            ====================================================== */

            stage.addEventListener(
                "pointercancel",
                function (e) {

                    pointers.delete(
                        e.pointerId
                    );


                    pinchActive =
                        false;

                    oneFingerActive =
                        false;

                }
            );


            /* =====================================================
               ROTATE LEFT
            ====================================================== */

            rotateLeft.addEventListener(
                "click",
                function () {

                    rotationY =
                        clamp(
                            rotationY - 10,
                            -MAX_Y,
                            MAX_Y
                        );


                    applyTransform(
                        true
                    );

                }
            );


            /* =====================================================
               ROTATE RIGHT
            ====================================================== */

            rotateRight.addEventListener(
                "click",
                function () {

                    rotationY =
                        clamp(
                            rotationY + 10,
                            -MAX_Y,
                            MAX_Y
                        );


                    applyTransform(
                        true
                    );

                }
            );


            /* =====================================================
               ROTATE UP
            ====================================================== */

            rotateUp.addEventListener(
                "click",
                function () {

                    rotationX =
                        clamp(
                            rotationX - 10,
                            -MAX_X,
                            MAX_X
                        );


                    applyTransform(
                        true
                    );

                }
            );


            /* =====================================================
               ROTATE DOWN
            ====================================================== */

            rotateDown.addEventListener(
                "click",
                function () {

                    rotationX =
                        clamp(
                            rotationX + 10,
                            -MAX_X,
                            MAX_X
                        );


                    applyTransform(
                        true
                    );

                }
            );


            /* =====================================================
               RESET
            ====================================================== */

            resetRotation.addEventListener(
                "click",
                function () {

                    rotationX = 0;

                    rotationY = 0;

                    rotationZ = 0;

                    zoom = INITIAL_ZOOM;


                    applyTransform(
                        true
                    );

                }
            );


            /* =====================================================
               DOUBLE CLICK / DOUBLE TAP
            ====================================================== */

            stage.addEventListener(
                "dblclick",
                function (e) {

                    if (
                        e.target.closest(
                            ".popup"
                        ) ||
                        e.target.closest(
                            ".rotation-controls"
                        )
                    ) {

                        return;

                    }


                    rotationX = 0;

                    rotationY = 0;

                    rotationZ = 0;

                    zoom = INITIAL_ZOOM;


                    applyTransform(
                        true
                    );

                }
            );


            /* =====================================================
   INITIAL STATE
====================================================== */
            /* =====================================================
               INITIAL STATE
            ====================================================== */

            reserveZoomSpace();
            applyTransform(false);
            requestAnimationFrame(centerStage);

            let resizeTimer;
            window.addEventListener("resize", function () {

                clearTimeout(resizeTimer);

                resizeTimer = setTimeout(function () {

                    reserveZoomSpace();
                    requestAnimationFrame(centerStage);

                }, 150);

            });

            requestAnimationFrame(function () {

                const scrollableWidth = stage.scrollWidth - stage.clientWidth;
                if (scrollableWidth > 0) {
                    stage.scrollLeft = scrollableWidth / 2;
                }

                const scrollableHeight = stage.scrollHeight - stage.clientHeight;
                if (scrollableHeight > 0) {
                    stage.scrollTop = scrollableHeight / 2;
                }

            });

            resetRotation.addEventListener("click", function () {

                rotationX = 0;
                rotationY = 0;
                rotationZ = 0;
                zoom = INITIAL_ZOOM;

                applyTransform(true);
                requestAnimationFrame(centerStage);

            });

        })();

    </script>
